services:
  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      - ENV=dev
      - STORAGE_TYPE=sql
      - DEFAULT_PROVIDER=mock
      - DEFAULT_MODEL=mock-gpt
      - POEM_EMBEDDED_WORKER=false
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://ai_user:ai_pass@postgres:5432/ai_platform
      - QDRANT_URL=http://qdrant:6333
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.worker
    environment:
      - ENV=dev
      - STORAGE_TYPE=sql
      - DATABASE_URL=postgresql://ai_user:ai_pass@postgres:5432/ai_platform
      - DEFAULT_PROVIDER=mock
      - DEFAULT_MODEL=mock-gpt
      - POEM_EMBEDDED_WORKER=false
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  postgres:
    image: pgvector/pgvector:pg16
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_user -d ai_platform"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      POSTGRES_USER: ai_user
      POSTGRES_PASSWORD: ai_pass
      POSTGRES_DB: ai_platform
    ports:
      - "5432:5432"

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
