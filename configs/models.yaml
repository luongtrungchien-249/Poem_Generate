models:
  # Mock model for test & local dev
  mock-gpt:
    provider: "mock"
    tier: "cheap"
    context_window: 8192
    max_output_tokens: 2048
    input_cost_per_million: 0.0
    output_cost_per_million: 0.0
    cached_input_cost_per_million: 0.0

  # OpenAI Models
  gpt-4o-mini:
    provider: "openai"
    tier: "cheap"
    context_window: 128000
    max_output_tokens: 16384
    input_cost_per_million: 0.15
    output_cost_per_million: 0.60
    cached_input_cost_per_million: 0.075

  gpt-4o:
    provider: "openai"
    tier: "standard"
    context_window: 128000
    max_output_tokens: 4096
    input_cost_per_million: 5.00
    output_cost_per_million: 15.00
    cached_input_cost_per_million: 2.50

  o1-preview:
    provider: "openai"
    tier: "reasoning"
    context_window: 128000
    max_output_tokens: 32768
    input_cost_per_million: 15.00
    output_cost_per_million: 60.00
    cached_input_cost_per_million: 7.50

  # Anthropic Models
  claude-3-5-haiku:
    provider: "anthropic"
    tier: "cheap"
    context_window: 200000
    max_output_tokens: 8192
    input_cost_per_million: 0.80
    output_cost_per_million: 4.00
    cached_input_cost_per_million: 0.08

  claude-3-5-sonnet:
    provider: "anthropic"
    tier: "standard"
    context_window: 200000
    max_output_tokens: 8192
    input_cost_per_million: 3.00
    output_cost_per_million: 15.00
    cached_input_cost_per_million: 0.30

  # Google (Gemini API) — dùng GOOGLE_API_KEY. Giá USD / 1 triệu token theo bảng giá
  # công khai của Google AI (bậc trả phí); KIỂM LẠI trước khi tin số chi phí.
  # Token "suy nghĩ" của dòng 2.5 tính như token ra (xem adapters/llm/google.py).
  # Chủ dự án chọn làm model Gemini mặc định, 26/09/2026.
  # ⚠️ CHƯA XÁC NHẬN tên trên API và CHƯA CÓ GIÁ: điền 3 dòng giá bên dưới theo bảng
  # giá Google AI rồi mới tin số chi phí của evals/do_that.py (đang tính 0 USD).
  # Kiểm tên: GET https://generativelanguage.googleapis.com/v1beta/models
  gemini-3.5-flash-lite:
    provider: "google"
    tier: "cheap"
    context_window: 1048576
    max_output_tokens: 65536
    input_cost_per_million: 0.0
    output_cost_per_million: 0.0
    cached_input_cost_per_million: 0.0

  gemini-2.5-flash-lite:
    provider: "google"
    tier: "cheap"
    context_window: 1048576
    max_output_tokens: 65536
    input_cost_per_million: 0.10
    output_cost_per_million: 0.40
    cached_input_cost_per_million: 0.025

  gemini-2.5-flash:
    provider: "google"
    tier: "standard"
    context_window: 1048576
    max_output_tokens: 65536
    input_cost_per_million: 0.30
    output_cost_per_million: 2.50
    cached_input_cost_per_million: 0.075

  gemini-2.5-pro:
    provider: "google"
    tier: "reasoning"
    context_window: 1048576
    max_output_tokens: 65536
    input_cost_per_million: 1.25
    output_cost_per_million: 10.00
    cached_input_cost_per_million: 0.31

  # vLLM / Self-hosted
  meta-llama-3.1-8b-instruct:
    provider: "vllm"
    tier: "cheap"
    context_window: 131072
    max_output_tokens: 4096
    input_cost_per_million: 0.10
    output_cost_per_million: 0.10
    cached_input_cost_per_million: 0.05

  meta-llama-3.1-70b-instruct:
    provider: "vllm"
    tier: "standard"
    context_window: 131072
    max_output_tokens: 4096
    input_cost_per_million: 0.60
    output_cost_per_million: 0.80
    cached_input_cost_per_million: 0.30

tiers:
  cheap:
    primary: "gpt-4o-mini"
    fallback: ["claude-3-5-haiku", "mock-gpt"]
  standard:
    primary: "gpt-4o"
    fallback: ["claude-3-5-sonnet", "mock-gpt"]
  reasoning:
    primary: "o1-preview"
    fallback: ["gpt-4o", "mock-gpt"]

# Bộ tier theo PROVIDER MẶC ĐỊNH (DEFAULT_PROVIDER). Provider không khai ở đây thì
# dùng `tiers` chung ở trên. Có nhiều khoá thì model dự phòng khác provider vẫn tới
# đúng nơi nhờ `adapters/llm/theo_model.py`; thiếu khoá thì bị bỏ qua để thử model sau.
tiers_theo_provider:
  google:
    cheap:
      primary: "gemini-3.5-flash-lite"
      fallback: ["gemini-2.5-flash-lite", "gpt-4o-mini", "mock-gpt"]
    standard:
      primary: "gemini-2.5-flash"
      fallback: ["gemini-2.5-flash-lite", "gpt-4o", "mock-gpt"]
    reasoning:
      primary: "gemini-2.5-pro"
      fallback: ["gemini-2.5-flash", "mock-gpt"]
