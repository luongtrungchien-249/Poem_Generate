# Alembic - migration cho kho SQL.
#
# CHU THICH O DAY PHAI LA ASCII. Alembic doc tep nay bang encoding LOCALE
# (cp1252 tren Windows), khong phai UTF-8 - nen tieng Viet co dau se lam vo
# ngay khi chay lenh dau tien. Phan giai thich day du bang tieng Viet nam o
# `migrations/env.py`, noi duoc doc bang UTF-8.
#
# `sqlalchemy.url` CO Y DE TRONG: DSN co the chua mat khau, nen khong bao gio
# nam trong tep commit duoc. `migrations/env.py` doc no tu DATABASE_URL.
[alembic]
script_location = migrations
prepend_sys_path = src
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
