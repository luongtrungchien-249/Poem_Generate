name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[api,worker,dev]"

      - name: Lint (Ruff)
        run: ruff check src tests evals

      - name: Type check (mypy — lõi siết chặt)
        run: mypy src

      - name: Kiểm tra ranh giới tầng (import-linter)
        run: lint-imports

      - name: Unit tests (thuần, không I/O)
        run: pytest -q tests/unit tests/architecture

      - name: Contract tests (HTTP/SSE)
        run: pytest -q tests/contract

      - name: Đối soát số liệu trong tài liệu (chặn số bịa)
        run: python datalake/scripts/doi_soat_tai_lieu.py
