[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-platform"
version = "2.0.0"
description = "Enterprise AI Platform — kiến trúc 4 vòng (domain / application / adapters / entrypoints)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.1",
    "pyyaml>=6.0.1",
    "structlog>=24.1.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "prometheus-client>=0.20.0",
    "python-dotenv>=1.0.1",
]
worker = [
    "redis>=5.0.0",
]
# Lưu trữ SQL — MỘT adapter, hai dialect (xem adapters/persistence/sql/).
# `sqlalchemy` + `aiosqlite` là phụ thuộc LÕI của nhánh lưu trữ bền vững, vì nhờ
# chúng mà adapter Postgres test được ngay trong CI bằng SQLite.
sql = [
    "sqlalchemy>=2.0.30",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.0",
]
postgres = [
    "sqlalchemy>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pgvector>=0.2.5",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "import-linter>=2.0",
    "pre-commit>=3.7.0",
    # Để test lưu trữ bền vững chạy được mà không cần hạ tầng.
    "sqlalchemy>=2.0.30",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.0",
]

[project.scripts]
ai-platform = "entrypoints.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
adapters = ["prompts/templates/**/*.yaml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "unit: kiểm thử thuần, không I/O, chạy dưới 5 giây",
    "integration: cần hạ tầng thật (Postgres, Redis, Qdrant)",
    "contract: kiểm chứng hợp đồng HTTP/SSE của API",
    "architecture: kiểm chứng ranh giới tầng",
    "postgres: cần một PostgreSQL thật qua DATABASE_URL; tự bỏ qua khi không có",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# E501: độ dài dòng đã do formatter lo.
# UP042: giữ `class Role(str, Enum)` thay vì StrEnum để Pydantic v2 và JSON giữ nguyên hành vi.
ignore = ["E501", "UP042"]

[tool.ruff.lint.flake8-bugbear]
# Depends()/Query() trong tham số mặc định là cách khai báo chuẩn của FastAPI, không phải lỗi.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Body",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
]

[tool.mypy]
python_version = "3.11"
packages = ["domain", "application", "adapters", "bootstrap", "contracts", "entrypoints"]
mypy_path = "src"
ignore_missing_imports = true

# Lõi phải sạch tuyệt đối; các vòng ngoài siết dần theo lộ trình.
[[tool.mypy.overrides]]
module = ["domain.*", "application.*"]
disallow_untyped_defs = true
warn_return_any = true
